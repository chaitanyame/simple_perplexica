services:
  # ============================================================
  # Primary AI Search API (Search Service)
  # ============================================================
  api:
    build:
      context: .
      dockerfile: services/searchsvc/Dockerfile
    image: chaitanyame/simple-perplexica:latest
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat-v3.1:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-text-embedding-3-small}
      - SEARXNG_URL=http://searxng:8080
      - SERPER_API_KEY=${SERPER_API_KEY}
      - SERPERDEV_API_KEY=${SERPERDEV_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - MEM0_ENABLED=${MEM0_ENABLED:-false}
    ports:
      - '3000:3001'  # Expose on port 3000 as primary service
    depends_on:
      - searxng
      - redis
    restart: unless-stopped

  # ============================================================
  # Search Engine (SearxNG)
  # ============================================================
  # ============================================================
  # Search Engine (SearxNG)
  # ============================================================
  searxng:
    image: searxng/searxng:latest
    ports:
      - '8080:8080'
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    restart: unless-stopped

  # ============================================================
  # Cache Layer (Redis)
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ============================================================
  # Research Service (Content Generation)
  # ============================================================
  researchsvc:
    build:
      context: .
      dockerfile: services/researchsvc/Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat-v3.1:free}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - HOST=0.0.0.0
      - PORT=3002
    ports:
      - '3002:3002'
    restart: unless-stopped

  # ============================================================
  # Optional: Streamlit UI for API Testing
  # ============================================================
  ui:
    build:
      context: .
      dockerfile: services/searchsvc/tools/Dockerfile
    environment:
      - API_BASE_URL=http://api:3001
    ports:
      - '8501:8501'
    depends_on:
      - api
      - researchsvc
    restart: unless-stopped

volumes:
  redis-data:
    name: 'simple-perplexica-redis'
