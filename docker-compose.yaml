services:
  vetuku:
    build:
      context: .
      dockerfile: Dockerfile
    image: chaitanyame/vetuku:latest
    ports:
      - '3010:3000'
    volumes:
      - data:/home/perplexica/data
      - uploads:/home/perplexica/uploads
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - '8080:8080'
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api-mvp:
    build:
      context: .
      dockerfile: services/api-mvp/Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat-v3.1:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-text-embedding-3-small}
      - SEARXNG_URL=http://searxng:8080
      - SERPERDEV_API_KEY=${SERPERDEV_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
    ports:
      - '3001:3001'
    depends_on:
      - searxng
      - redis
    restart: unless-stopped

  api-mvp-ui:
    build:
      context: .
      dockerfile: services/api-mvp/tools/Dockerfile
    environment:
      - API_BASE_URL=http://api-mvp:3001
    ports:
      - '8501:8501'
    depends_on:
      - api-mvp
    restart: unless-stopped

volumes:
  data:
    name: 'vetuku-data'
  uploads:
    name: 'vetuku-uploads'
  redis-data:
    name: 'vetuku-redis-data'
