[pytest]
# Pytest configuration for Simple Perplexica test suite

# Suppress third-party deprecation warnings we can't control
filterwarnings =
    # Ignore spacy/Click deprecation warning about parser.split_arg_string
    ignore::DeprecationWarning:spacy.cli._util
    # Ignore BeautifulSoup4/lxml deprecation warning about strip_cdata
    ignore::DeprecationWarning:bs4.builder._lxml
    # Ignore other common third-party warnings
    ignore:.*pkg_resources.declare_namespace.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = --strict-markers --tb=short

# Markers for different test categories
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
